[package]
name = "privoxy-rust"
version = "4.1.0"
edition = "2024"
authors = ["Privoxy Team"]
description = "Rust implementation of Privoxy - A web proxy with advanced filtering capabilities"
license = "GPL-2.0-or-later"
repository = "https://www.privoxy.org/"
rust-version = "1.85"

[features]
# SSL/TLS backends
openssl-ssl = ["dep:openssl", "dep:tokio-openssl"]
native-tls = ["dep:native-tls", "dep:tokio-native-tls"]
rustls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rustls-pki-types", "dep:rustls-native-certs"]
mbedtls = []
wolfssl = ["dep:wolfssl"]

# Optional features
compression = ["dep:flate2"]
https-inspection = ["rustls"]
https-inspection-mbedtls = ["mbedtls"]
https-inspection-openssl = ["openssl-ssl"]
https-inspection-wolfssl = ["wolfssl"]
client-tags = []
statistics = []
extended-statistics = []
toggle = []
force-load = []
fast-redirects = []
image-blocking = []
acl = []
trust = []
cgi-edit-actions = []
cgi = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "cgi-edit-actions"]
no-gifs = []
graceful-termination = []
pcre-host-patterns = []
external-filter = []
accept-filter = []
strptime-sanity-checks = []
connection-keep-alive = []
connection-sharing = []
fuzz = []

# Windows-specific features
windows-service = ["dep:windows-service"]

# Tray icon (cross-platform)
tray-icon = ["dep:tray-icon", "dep:winit", "dep:rfd", "dep:libui"]

# Default features
default = ["rustls", "compression", "toggle", "force-load", "fast-redirects", "statistics", "image-blocking", "acl", "trust", "cgi-edit-actions", "connection-keep-alive", "connection-sharing", "client-tags"]



[dependencies]
tokio = { version = "1.44", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time", "chrono", "fmt"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.11"
lazy_static = "1.5"
once_cell = "1.21"
chrono = "0.4"
bytes = "1.10"
http = "1.3"
httparse = "1.10"
url = "2.5"
base64 = "0.22"
tokio-socks = "0.5"
parking_lot = "0.12"
rand = "0.8"

# SSL/TLS dependencies (optional)
openssl = { version = "0.10", features = ["vendored"], optional = true }
tokio-openssl = { version = "0.6", optional = true }
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2.1", optional = true }
rustls-pki-types = { version = "1.7", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
wolfssl = { version = "4.1", optional = true }

# Compression
flate2 = { version = "1.1", optional = true }

# CGI/Web interface
hyper = { version = "1.5", optional = true }
hyper-util = { version = "0.1", optional = true, features = ["full"] }
http-body-util = { version = "0.1", optional = true }

# Windows service
windows-service = { version = "0.7", optional = true }

# Tray icon
tray-icon = { version = "0.19", optional = true }
winit = { version = "0.30", optional = true }
rfd = { version = "0.14.0", optional = true }
libui = { version = "0.4", optional = true }
winapi = { version = "0.3", optional = true, features = ["winuser"] }
ipnet = "2.12.0"
opener = "0.7"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }


